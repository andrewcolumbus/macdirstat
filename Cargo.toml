[package]
name = "macdirstat"
version = "0.1.3"
edition = "2024"
description = "WinDirStat-style disk usage treemap for macOS"
license = "MIT"
rust-version = "1.95"
publish = false

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_extras = "0.36"
rayon = "1.11"
rfd = "0.17"
trash = "5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
