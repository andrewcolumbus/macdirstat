name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      # The runner has no Developer ID, so the app is signed ad hoc and the
      # DMG is not notarized.
      - name: Build universal DMG
        env:
          MACDIRSTAT_UNIVERSAL: 1
          MACDIRSTAT_DMG: 1
        run: |
          scripts/bundle.sh
          lipo -archs target/release/MacDirStat.app/Contents/MacOS/MacDirStat
          test -s target/release/MacDirStat.app/Contents/Resources/Assets.car

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/MacDirStat.dmg \
            --verify-tag --generate-notes --title "MacDirStat ${GITHUB_REF_NAME#v}"
