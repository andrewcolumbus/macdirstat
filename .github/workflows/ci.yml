name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Bundle
        run: scripts/bundle.sh
      - name: Check Liquid Glass icon
        run: |
          CAR=target/release/MacDirStat.app/Contents/Resources/Assets.car
          if [[ ! -s "$CAR" ]]; then
            echo "::error::Assets.car is missing; the app would get a flat icon on macOS 26 and later"
            exit 1
          fi
          xcrun assetutil --info "$CAR" | grep -E '"(AssetType|Appearance|Name)"' | sort | uniq -c
      - uses: actions/upload-artifact@v4
        with:
          name: MacDirStat.app
          path: target/release/MacDirStat.app
